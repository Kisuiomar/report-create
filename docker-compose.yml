version: '3.8'

services:
  ollama-server:
    image: ollama/ollama:latest
    container_name: spark-dossier-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web-app:
    build: .
    container_name: spark-dossier-app
    restart: unless-stopped
    # Порт 8080 больше не торчит наружу, доступ только для Nginx
    expose:
      - "8080"
    environment:
      - LLM_PROVIDER=ollama
      - LLM_BASE_URL=http://ollama-server:11434
      - LLM_MODEL=orcarouter/Qwen3.8-27B-Uncensored
      - LLM_NUM_CTX=131072
      - LLM_REQUEST_TIMEOUT=2400
    depends_on:
      - ollama-server
    volumes:
      - ./data:/app/data

  nginx:
    image: nginx:latest
    container_name: spark-dossier-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-app

volumes:
  ollama_data:
