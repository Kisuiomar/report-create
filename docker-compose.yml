version: '3.8'

services:
  ollama-server:
    image: ollama/ollama:latest
    container_name: spark-dossier-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web-app:
    build: .
    container_name: spark-dossier-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=ollama
      # Обращение к контейнеру Ollama по его имени во внутренней сети Docker
      - LLM_BASE_URL=http://ollama-server:11434
      - LLM_MODEL=orcarouter/Qwen3.8-27B-Uncensored
      - LLM_NUM_CTX=128000
      - LLM_REQUEST_TIMEOUT=2400
    depends_on:
      - ollama-server
    volumes:
      - ./data:/app/data

volumes:
  ollama_data:
